<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebMind</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<!-- HEADER -->
<header id="header">
  <div class="header-left">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="9" stroke="white" stroke-width="1.5"/>
        <circle cx="10" cy="10" r="4" fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.5"/>
        <line x1="10" y1="1" x2="10" y2="4" stroke="white" stroke-width="1.5"/>
        <line x1="10" y1="16" x2="10" y2="19" stroke="white" stroke-width="1.5"/>
        <line x1="1" y1="10" x2="4" y2="10" stroke="white" stroke-width="1.5"/>
        <line x1="16" y1="10" x2="19" y2="10" stroke="white" stroke-width="1.5"/>
      </svg>
      <span>WebMind</span>
    </div>
  </div>
  <div class="header-right">
    <button id="btnHistory" class="icon-btn" title="Chat History">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="2" width="14" height="2.5" rx="1" fill="currentColor"/>
        <rect x="1" y="6.8" width="10" height="2.5" rx="1" fill="currentColor"/>
        <rect x="1" y="11.5" width="12" height="2.5" rx="1" fill="currentColor"/>
      </svg>
    </button>
    <button id="btnOptions" class="icon-btn" title="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.93 2.93l1.41 1.41M11.66 11.66l1.41 1.41M2.93 13.07l1.41-1.41M11.66 4.34l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>

<!-- PAGE CONTEXT BAR -->
<div id="pageBar" class="page-bar hidden">
  <div class="page-bar-inner">
    <span id="pageType" class="badge"></span>
    <span id="pageTitle" class="page-title"></span>
  </div>
  <button id="btnRefresh" class="icon-btn-sm" title="Re-analyze page">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M11 6.5A4.5 4.5 0 1 1 6.5 2a4.5 4.5 0 0 1 3.18 1.32L11 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M9 5h2.5V2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<!-- LOADING STATE -->
<div id="loadingState" class="loading-state">
  <div class="spinner"></div>
  <p>Analyzing page…</p>
</div>

<!-- NO KEY WARNING -->
<div id="noKeyState" class="empty-state hidden">
  <div class="empty-icon">🔑</div>
  <p>Add an API key to start chatting</p>
  <button id="btnGoOptions" class="btn-primary">Open Settings</button>
</div>

<!-- CHAT VIEW -->
<div id="chatView" class="hidden">
  <!-- Suggested questions -->
  <div id="suggestions" class="suggestions"></div>

  <!-- Selection toast -->
  <div id="selectionToast" class="selection-toast hidden">
    <span id="selectionPreview"></span>
    <button id="btnAskSelection" class="btn-ask">Ask about this</button>
    <button id="btnDismissSelection" class="icon-btn-sm">✕</button>
  </div>

  <!-- Messages -->
  <div id="messages" class="messages"></div>

  <!-- Input area -->
  <div class="input-area">
    <div class="model-row">
      <select id="modelSelect" class="model-select">
        <optgroup label="OpenAI">
          <option value="gpt-4o-mini">GPT-4o mini</option>
          <option value="gpt-4o">GPT-4o</option>
        </optgroup>
        <optgroup label="Anthropic">
          <option value="claude-haiku-4-5-20251001">Claude Haiku</option>
          <option value="claude-sonnet-4-5">Claude Sonnet</option>
        </optgroup>
        <optgroup label="Google">
          <option value="gemini-1.5-flash">Gemini Flash</option>
          <option value="gemini-1.5-pro">Gemini Pro</option>
        </optgroup>
      </select>
      <button id="btnExport" class="icon-btn-sm" title="Export chat">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 1v8M3.5 6l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M1 10v1.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btnClear" class="icon-btn-sm" title="Clear chat">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 3h9M4.5 3V2a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5v1M5 6v4M8 6v4M3 3l.7 8a.5.5 0 0 0 .5.5h5.6a.5.5 0 0 0 .5-.5L11 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="input-row">
      <textarea id="inputBox" placeholder="Ask anything about this page…" rows="1"></textarea>
      <button id="btnSend" class="send-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M14 8H2M9 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- HISTORY VIEW -->
<div id="historyView" class="hidden">
  <div class="history-header">
    <span>Chat History</span>
    <button id="btnClearHistory" class="text-btn danger">Clear all</button>
  </div>
  <div id="historyList" class="history-list"></div>
</div>

<script src="panel.js"></script>
</body>
</html>
